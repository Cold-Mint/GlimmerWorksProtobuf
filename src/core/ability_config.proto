syntax = "proto3";
message AbilityConfigMessage{
  //canMineBlock
  //是否能挖掘方块
  bool allowMineBlock = 1;
  //digRange
  //挖掘范围
  int64 miningRange = 2;
  //Using the item is more likely to cause accidental dropping.
  //使用物品时多大概率触发手滑
  float fumbleProbability = 3;
  //chainMiningRadius
  //连锁采集半径
  int64 chainMiningRadius = 4;
  //precisionMining
  //是否精准采集
  bool enablePrecisionMining = 5;
  //Tool efficiency
  //工具效率
  float miningEfficiency = 6;
}