syntax = "proto3";
option optimize_for = LITE_RUNTIME;
enum PlaceSourceMessage {
  //Placed by the World Generator.
  //由世界生成器放置。
  PLACE_SOURCE_WORLD_GEN = 0;
  //Place it on the console.
  //由控制台放置。
  PLACE_SOURCE_CONSOLE = 1;
  //Placed by the players.
  //由玩家放置。
  PLACE_SOURCE_PLAYER = 2;
  //Placed by growing crops.
  //由作物长大放置。
  PLACE_SOURCE_CROP_GROWTH = 3;
  //Placed as a result of breaking a tile (usually air).
  //因破坏方块而放置（通常为空气）。
  PLACE_SOURCE_BREAK = 4;
}