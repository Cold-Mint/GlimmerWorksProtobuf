syntax = "proto3";
option optimize_for = LITE_RUNTIME;
import "src/core/resource_ref.proto";
message DimensionManifestMessage {
  ResourceRefMessage dimension = 1;
  //The tick timestamp when all players within this dimension leave, used for time compensation during cross-dimensional switching
  //此维度内的所有玩家都离开的tick时间戳，用于跨维度切换时间补偿
  uint64 lastZeroPlayerTick = 2;
  //The first tick timestamp when this dimension was generated
  //第一次生成此维度的tick时间戳
  uint64 firstSpawnTick = 3;
};