syntax = "proto3";
option optimize_for = LITE_RUNTIME;
import "src/core/resource_ref.proto";
import "src/core/vector2di.proto";
import "src/core/place_source_message.proto";
import "src/saves/item_container.proto"

/**
Single-grid independent operation state (data not saved in the tile sharing instance)
单格独立运行状态（数据不保存在瓦片共享实例内）
*/
message TileStateMessage {
  ResourceRefMessage resourceRef = 1;
  PlaceSourceMessage placeSource = 2;
  //If the offset is 0, 0, it indicates that it is in the top-left corner.
  //如果offset为0,0,那么表示在左上角。
  Vector2DIMessage offset = 3;
  uint32 width = 4;
  uint32 height = 5;
  //瓦片被放置下去的tick时间戳
  uint64 tilePlacedTick = 6;
  //本次开始生长的tick时间戳（当生长条件满足时开始记录）
  uint64 tileGrowthStartTick = 7;
  //已经成功成熟的次数
  uint32 matureCount = 8;
  //长大所需的tick数（实例创建时的随机时长growthMinTicks到growthMaxTicks）
  uint64 tileGrowthRequiredTick = 9;
  //已经累积的tick数进度
  uint64 tileGrowthAccumulatedTick = 10;
  //瓦片生长上一轮校验：是否满足生长条件，存入存档
  bool tileGrowthConditionsMet = 11;
  //附着方向：0无 1上 2右 3下 4左 5背景(下层)
  uint32 attachmentDirection = 12;
  //附着点偏移（相对瓦片原点，指向支撑瓦片；方向1-4为单位向量，方向5与无附着为0,0）
  Vector2DIMessage attachmentOffset = 13;
  //存储方块的物品容器（含容量与内容物），仅当瓦片为存储方块时使用。
  ItemContainerMessage itemContainer = 14;
}
