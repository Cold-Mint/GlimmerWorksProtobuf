syntax = "proto3";
import "src/core/resource_ref.proto";
option optimize_for = LITE_RUNTIME;
message MapManifestMessage {
  string name = 1;
  string gameVersionName = 2;
  uint32 gameVersionNumber = 3;
  int32 seed = 4;
  int64 createTime = 5;
  //The tick count of this archived experience.
  //此存档经历的tick数。
  uint64 globalTickCount = 6;
  uint32 entityIDIndex = 7;
};